[server]
# Configuración del servidor
port = 8501
baseUrlPath = ""
enableCORS = true
enableXsrfProtection = true

# Configuración de archivos y uploads
maxUploadSize = 200  # MB - Permitir archivos más grandes para datos provinciales
maxMessageSize = 200  # MB - Aumentado para gráficos complejos

# Configuración de rendimiento
enableStaticServing = true
runOnSave = false  # Desactivar en producción
allowRunOnSave = false  # Seguridad adicional

# Configuración de headers de seguridad
enableWebsocketCompression = true

[client]
# Configuración de la interfaz de cliente
showSidebarNavigation = false
showErrorDetails = false  # En producción, no mostrar detalles de errores
toolbarMode = "developer"  # minimal, developer, viewer

[theme]
# Tema del Portal SICyT
base = "light"

# Colores oficiales de la identidad visual argentina
primaryColor = "#354B6E"          # Azul SICyT
backgroundColor = "#eff2f7ff"
secondaryBackgroundColor = "#9dafc5ff"  # Fondo de barras laterales
textColor = "#232D4F"            # Color de texto principal

# Tipografía
font = "Poppins, 'Helvetica Neue', Arial, sans-serif"
baseFontSize = 18  # Tamaño base para accesibilidad

[theme.sidebar]
backgroundColor = "#354B6E"
secondaryBackgroundColor = "#8999acff"
textColor = "#eff2f7ff"

[logger]
# Configuración de logging para aplicaciones gubernamentales
level = "info"  # En desarrollo usar "debug", en producción "info" o "warning"
messageFormat = "%(asctime)s | %(levelname)s | %(name)s | %(funcName)s:%(lineno)d | %(message)s"


[browser]
# Configuración del navegador
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[global]
# Configuraciones globales para mejor rendimiento
developmentMode = false  # Cambiar a true solo en desarrollo
maxCachedMessageAge = 3600  # 1 hora en segundos
minCachedMessageSize = 1024  # 1KB mínimo para cachear

# Configuración de widgets
unitTest = false

[runner]
# Configuración del runner de Streamlit
magicEnabled = true
postScriptGC = true  # Garbage collection después de scripts
fastReruns = true  # Optimización de re-ejecuciones

[mapbox]
# Si se usan mapas (para datos geográficos provinciales)
# token = "tu_token_de_mapbox_aqui"

# Para personalización avanzada si es necesario
[experimental]
# Características experimentales (usar con cuidado en producción)
# allowWidgetMutability = false
# suppressDeprecationWarnings = true