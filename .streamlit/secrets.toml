# Configuración de Base de Datos
DB_HOST = 'localhost'
DB_PORT = '5432'
DB_USER = 'informes_user'
DB_PASSWORD = 'informes_pass'
DB_NAME = 'informes_db'

# Configuración de Logos y Assets
LOGO_CORTO = 'static/logo/logo_home_jgm_corto.png'
LOGO_LARGO = 'static/logo/logo_home_jgm_largo.png'
USE_ICONS = true

# Configuración de Logging y Debugging
DEBUG_MODE = false  # true solo en desarrollo
SHOW_WARNINGS = true
SHOW_LOGS_UI = false  # true solo para admins
LOG_QUERIES = false  # true solo en desarrollo/debugging

# Configuración de Seguridad
DEFAULT_ADMIN_PASSWORD = "cambiar_en_produccion"
SESSION_TIMEOUT = 3600  # segundos (1 hora)
ENCRYPT_SENSITIVE_DATA = true

# Configuración de Notificaciones (opcional)
ADMIN_EMAILS = ["admin1@sicyt.gob.ar", "admin2@sicyt.gob.ar"]
SMTP_HOST = "smtp.servidor.gov.ar"
SMTP_PORT = 587
SMTP_USER = ""  # completar si se usa
SMTP_PASSWORD = ""  # completar si se usa
SMTP_USE_TLS = true

# Configuración de Rendimiento
CACHE_TTL = 600  # Time-to-live del cache (segundos)
MAX_WORKERS = 4  # Workers para procesamiento paralelo
QUERY_TIMEOUT = 30  # Timeout de queries en segundos
MAX_ROWS_DISPLAY = 1000  # Máximo de filas a mostrar en tablas

# Configuración de APIs externas (si se usan)
# MAPBOX_TOKEN = "tu_token_mapbox"
# API_KEY_EXTERNA = "tu_api_key"

# Configuración específica del entorno
ENVIRONMENT = "development"  # development, staging, production
APP_VERSION = "1.0.0"
MAINTENANCE_MODE = false

# URLs de servicios externos (si aplica)
# EXTERNAL_API_BASE_URL = "https://api.servicio.gov.ar"
# BACKUP_SERVICE_URL = "https://backup.internal.gov.ar"