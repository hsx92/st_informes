# Configuración de cookies del sistema
cookie:
  expiry_days: 7.0  # Duración de la sesión en días
  key: HUeS}9+l@$]n}pE  # Clave secreta para firmar cookies (cambiar en producción)
  name: informesv2_sicyt_session  # Nombre de la cookie

# Configuración de credenciales de usuarios
credentials:
  usernames:
    # Usuario administrador por defecto
    admin:
      email: dgicyt@sicyt.gob.ar
      failed_login_attempts: 0
      first_name: Administrador
      last_name: Sistema
      logged_in: false
      password: $2b$12$P/yeE77dsRNcR0TCOGwdaexVFtcQuaRC3WXcPJY7zpTJcLxS5OYna  # admin123
      roles:
      - admin
      - director
    
    # Usuario de prueba para directores
    director_test:
      email: director.test@sicyt.gob.ar
      failed_login_attempts: 0
      first_name: Director
      last_name: Prueba
      logged_in: false
      password: $2b$12$X8kzI0Z9rM.QbF5vK2LcOeG7nR8sT4uV6wY9zA1bC3dE5fG7hI8jK  # director123
      roles:
      - director
    
    # Usuario estándar de ejemplo
    usuario_demo:
      email: demo@sicyt.gob.ar
      failed_login_attempts: 0
      first_name: Usuario
      last_name: Demostración
      logged_in: false
      password: $2b$12$M9nP0qR1sT2uV3wX4yZ5aB6cD7eF8gH9iJ0kL1mN2oP3qR4sT5uV6  # demo123
      roles:
      - usuario

# Lista de usuarios pre-autorizados (opcional)
# Usuarios en esta lista pueden registrarse automáticamente sin aprobación manual
pre-authorized:
- admin
- director_test

# Configuración de seguridad
security:
  # Número máximo de intentos fallidos antes de bloquear cuenta
  max_failed_attempts: 3
  
  # Tiempo de bloqueo en minutos (0 = bloqueo permanente hasta reset manual)
  lockout_duration: 0
  
  # Requerir confirmación de email para nuevos usuarios
  require_email_verification: false
  
  # Permitir auto-registro de usuarios
  allow_self_registration: true
  
  # Roles permitidos para auto-registro
  allowed_registration_roles:
  - usuario
  - director

# Configuración de notificaciones
notifications:
  # Email del administrador para notificaciones
  admin_email: dgicyt@sicyt.gob.ar
  
  # Notificar cuando se registra un nuevo usuario
  notify_new_user: true
  
  # Notificar intentos de login fallidos
  notify_failed_login: false
  
  # Notificar cambios de contraseña
  notify_password_change: true

# Configuración de la aplicación
app_config:
  # Nombre de la aplicación
  app_name: "Portal SICyT"
  
  # Versión del sistema de usuarios
  user_system_version: "2.1.0"
  
  # URL base de la aplicación (para emails de recuperación)
  base_url: "https://portal-sicyt.gob.ar"
  
  # Configuración de emails (para funcionalidades futuras)
  email_config:
    smtp_server: ""
    smtp_port: 587
    smtp_user: ""
    smtp_password: ""
    use_tls: true

# Mensajes personalizables
messages:
  welcome_message: |
    Bienvenido al Portal de la Secretaría de Innovación, Ciencia y Tecnología.
    Acceda a información y herramientas para el desarrollo científico-tecnológico del país.
  
  login_help: |
    Si es la primera vez que accede al sistema, puede crear una nueva cuenta.
    Si olvidó su contraseña, puede recuperarla usando su nombre de usuario.
  
  registration_success: |
    Su cuenta ha sido creada exitosamente. Ya puede iniciar sesión con sus credenciales.
  
  password_reset_success: |
    Se ha generado una nueva contraseña temporal. Por seguridad, cámbiela después de iniciar sesión.

# Configuración de roles y permisos
role_permissions:
  admin:
    description: "Administrador del sistema con acceso completo"
    permissions:
    - user_management
    - system_config
    - view_all_data
    - export_data
    - backup_restore
    
  director:
    description: "Director con acceso a datos regionales/provinciales"
    permissions:
    - view_regional_data
    - export_regional_data
    - manage_regional_users
    
  usuario:
    description: "Usuario estándar con acceso básico"
    permissions:
    - view_basic_data
    - export_basic_data

# Configuración de auditoría (para futuras implementaciones)
audit:
  # Registrar logins exitosos
  log_successful_login: true
  
  # Registrar intentos fallidos
  log_failed_login: true
  
  # Registrar cambios de contraseña
  log_password_changes: true
  
  # Registrar creación/eliminación de usuarios
  log_user_changes: true
  
  # Retener logs por días
  retention_days: 90

# Configuración de backup automático
backup:
  # Realizar backup automático
  auto_backup: false
  
  # Frecuencia de backup (daily, weekly, monthly)
  frequency: "weekly"
  
  # Directorio de backups
  backup_directory: "backups/users"
  
  # Número de backups a retener
  retention_count: 10